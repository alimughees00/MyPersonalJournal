name: Android Release Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select build artifact type'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - aab
          - apk
      version_code:
        description: 'Version Code (leave blank to keep default in build.gradle)'
        required: false
        default: ''
        type: string
      version_name:
        description: 'Version Name (e.g. 1.0.4, leave blank to keep default in build.gradle)'
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci || npm install

      - name: Patch dependencies for React Native 0.83 compatibility
        run: |
          echo "Patching react-native-audio-recorder-player for RN 0.83..."
          FILE_AUDIO="node_modules/react-native-audio-recorder-player/android/src/main/java/com/dooboolab.audiorecorderplayer/RNAudioRecorderPlayerModule.kt"
          if [ -f "$FILE_AUDIO" ]; then
            sed -i 's/reactContext\.currentActivity/currentActivity/g' "$FILE_AUDIO"
            sed -i 's/reactContext\.applicationContext/reactContext/g' "$FILE_AUDIO"
            echo "Successfully patched RNAudioRecorderPlayerModule.kt"
          fi

          echo "Patching @react-native-community/datetimepicker for RN 0.83..."
          FILE_DATE="node_modules/@react-native-community/datetimepicker/android/src/main/java/com/reactcommunity/rndatetimepicker/RNMaterialDatePicker.kt"
          if [ -f "$FILE_DATE" ]; then
            sed -i 's/reactContext\.currentActivity/reactContext.getCurrentActivity()/g' "$FILE_DATE"
            echo "Successfully patched RNMaterialDatePicker.kt"
          fi

      - name: Setup Java JDK (Java 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build React Native Gradle Plugin Jar
        working-directory: node_modules/@react-native/gradle-plugin
        run: |
          chmod +x gradlew
          ./gradlew :react-native-gradle-plugin:jar --no-daemon

      - name: Clean local OS-specific paths from Gradle properties
        run: |
          echo "Sanitizing gradle.properties..."
          # Strip any potential hardcoded local machine paths or OS-specific properties
          if [ -f android/gradle.properties ]; then
            sed -i '/org\.gradle\.java\.home/d' android/gradle.properties
            sed -i '/NODE_BINARY/d' android/gradle.properties
            sed -i '/sdk\.dir/d' android/gradle.properties
          fi
          # Ensure no leftover local.properties overrides SDK on Linux runner
          rm -f android/local.properties android/app/local.properties

      - name: Reconstruct Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not configured in repository secrets!"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/myjournal-release-key.keystore
          echo "Keystore successfully decoded to android/app/myjournal-release-key.keystore"

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android App Bundle (AAB)
        if: ${{ github.event.inputs.build_type == 'aab' || github.event.inputs.build_type == 'both' || github.event_name == 'push' }}
        working-directory: android
        env:
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'myjournal' }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD || 'myjournal' }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'myjournal-key-alias' }}
          INPUT_VERSION_CODE: ${{ github.event.inputs.version_code }}
          INPUT_VERSION_NAME: ${{ github.event.inputs.version_name }}
        run: |
          VERSION_PROPS=""
          if [ -n "$INPUT_VERSION_CODE" ]; then
            echo "Overriding versionCode: $INPUT_VERSION_CODE"
            VERSION_PROPS="$VERSION_PROPS -PversionCode=$INPUT_VERSION_CODE"
          fi
          if [ -n "$INPUT_VERSION_NAME" ]; then
            echo "Overriding versionName: $INPUT_VERSION_NAME"
            VERSION_PROPS="$VERSION_PROPS -PversionName=$INPUT_VERSION_NAME"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            echo "Using versionName from tag: $TAG_VERSION"
            VERSION_PROPS="$VERSION_PROPS -PversionName=$TAG_VERSION"
          fi

          ./gradlew bundleRelease \
            -PMYAPP_UPLOAD_STORE_PASSWORD="$STORE_PASS" \
            -PMYAPP_UPLOAD_KEY_PASSWORD="$KEY_PASS" \
            -PMYAPP_UPLOAD_KEY_ALIAS="$KEY_ALIAS" \
            $VERSION_PROPS \
            --no-daemon

      - name: Build Android Package (APK)
        if: ${{ github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == 'both' || github.event_name == 'push' }}
        working-directory: android
        env:
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'myjournal' }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD || 'myjournal' }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'myjournal-key-alias' }}
          INPUT_VERSION_CODE: ${{ github.event.inputs.version_code }}
          INPUT_VERSION_NAME: ${{ github.event.inputs.version_name }}
        run: |
          VERSION_PROPS=""
          if [ -n "$INPUT_VERSION_CODE" ]; then
            echo "Overriding versionCode: $INPUT_VERSION_CODE"
            VERSION_PROPS="$VERSION_PROPS -PversionCode=$INPUT_VERSION_CODE"
          fi
          if [ -n "$INPUT_VERSION_NAME" ]; then
            echo "Overriding versionName: $INPUT_VERSION_NAME"
            VERSION_PROPS="$VERSION_PROPS -PversionName=$INPUT_VERSION_NAME"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            echo "Using versionName from tag: $TAG_VERSION"
            VERSION_PROPS="$VERSION_PROPS -PversionName=$TAG_VERSION"
          fi

          ./gradlew assembleRelease \
            -PMYAPP_UPLOAD_STORE_PASSWORD="$STORE_PASS" \
            -PMYAPP_UPLOAD_KEY_PASSWORD="$KEY_PASS" \
            -PMYAPP_UPLOAD_KEY_ALIAS="$KEY_ALIAS" \
            $VERSION_PROPS \
            --no-daemon

      - name: Upload Release AAB Artifact
        if: ${{ (github.event.inputs.build_type == 'aab' || github.event.inputs.build_type == 'both' || github.event_name == 'push') && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 14

      - name: Upload Release APK Artifact
        if: ${{ (github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == 'both' || github.event_name == 'push') && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14
