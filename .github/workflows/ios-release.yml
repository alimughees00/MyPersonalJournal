name: iOS Release Build

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: 'Export method (app-store, ad-hoc, development)'
        required: true
        default: 'app-store'
        type: choice
        options:
          - app-store
          - ad-hoc
          - development
      build_number:
        description: 'Build Number / CFBundleVersion (leave blank to auto-increment via GitHub run number)'
        required: false
        default: ''
        type: string
      version_name:
        description: 'Marketing Version / CFBundleShortVersionString (e.g. 1.0.1, leave blank to keep default)'
        required: false
        default: ''
        type: string
      upload_to_testflight:
        description: 'Upload directly to TestFlight'
        required: true
        default: true
        type: boolean
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS Release
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci || npm install

      - name: Patch dependencies for React Native 0.83 compatibility
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          function findAndPatch(dir) {
            if (!fs.existsSync(dir)) return;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const fullPath = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                findAndPatch(fullPath);
              } else if (entry.name === 'RNAudioRecorderPlayerModule.kt') {
                let code = fs.readFileSync(fullPath, 'utf8');
                code = code.replace(/\bcurrentActivity\b/g, 'getCurrentActivity()');
                code = code.replace(/mediaPlayer!!\.setDataSource\([^,]+,\s*Uri\.parse/g, 'mediaPlayer!!.setDataSource(reactContext, Uri.parse');
                fs.writeFileSync(fullPath, code);
                console.log('Successfully patched: ' + fullPath);
              } else if (entry.name === 'RNMaterialDatePicker.kt') {
                let code = fs.readFileSync(fullPath, 'utf8');
                code = code.replace(/reactContext\.currentActivity/g, 'reactContext.getCurrentActivity()');
                fs.writeFileSync(fullPath, code);
                console.log('Successfully patched: ' + fullPath);
              }
            }
          }
          findAndPatch('node_modules');
          "

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Setup CocoaPods Cache
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods
        working-directory: ios
        run: |
          pod install

      - name: Configure Version Numbers
        working-directory: ios
        env:
          INPUT_VERSION_NAME: ${{ github.event.inputs.version_name }}
          INPUT_BUILD_NUMBER: ${{ github.event.inputs.build_number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION_NAME="$INPUT_VERSION_NAME"
          if [ -z "$VERSION_NAME" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            echo "Using marketing version from tag: $VERSION_NAME"
          fi

          BUILD_NUMBER="$INPUT_BUILD_NUMBER"
          if [ -z "$BUILD_NUMBER" ]; then
            # Automatically calculate build number so TestFlight never rejects duplicate/lower build numbers
            CURRENT_BASE=$(xcrun agvtool what-version | tr -cd '0-9')
            CURRENT_BASE=${CURRENT_BASE:-2}
            BUILD_NUMBER=$(( CURRENT_BASE + RUN_NUMBER ))
            echo "Auto-incrementing build number (Base $CURRENT_BASE + GitHub Run #$RUN_NUMBER): $BUILD_NUMBER"
          else
            echo "Using user-specified build number: $BUILD_NUMBER"
          fi

          echo "Applying build number (CFBundleVersion): $BUILD_NUMBER"
          xcrun agvtool new-version -all "$BUILD_NUMBER"

          if [ -n "$VERSION_NAME" ]; then
            echo "Updating marketing version (CFBundleShortVersionString) to: $VERSION_NAME"
            xcrun agvtool new-marketing-version "$VERSION_NAME"
          fi

          echo "Current project version configuration:"
          xcrun agvtool what-version
          xcrun agvtool what-marketing-version

      - name: Install Apple Certificate and Provisioning Profile
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID_INPUT: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [ -z "$CERTIFICATE_BASE64" ]; then
            echo "::error::IOS_CERTIFICATE_BASE64 secret is not configured in repository secrets!"
            exit 1
          fi
          if [ -z "$PROVISIONING_PROFILE_BASE64" ]; then
            echo "::error::IOS_PROVISIONING_PROFILE_BASE64 secret is not configured in repository secrets!"
            exit 1
          fi

          # Generate temporary keychain path and secure password
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)

          # Create keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add temporary keychain to search list
          ORIGINAL_KEYCHAINS=$(security list-keychains -d user | tr -d '"')
          security list-keychains -d user -s "$KEYCHAIN_PATH" $ORIGINAL_KEYCHAINS

          # Decode and import the .p12 certificate
          CERT_FILE="$RUNNER_TEMP/certificate.p12"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERT_FILE"
          security import "$CERT_FILE" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/pkgbuild -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Extract signing identity common name
          CERT_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -E "Apple Distribution|iPhone Distribution" | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$CERT_IDENTITY" ]; then
            echo "::warning::No explicit 'Apple Distribution' string found in identity list. Defaulting to 'Apple Distribution'."
            CERT_IDENTITY="Apple Distribution"
          fi
          echo "Discovered Signing Identity: $CERT_IDENTITY"

          # Decode and install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_FILE="$RUNNER_TEMP/profile.mobileprovision"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_FILE"

          PROFILE_UUID=$(security cms -D -i "$PROFILE_FILE" | plutil -extract UUID raw -)
          PROFILE_NAME=$(security cms -D -i "$PROFILE_FILE" | plutil -extract Name raw -)
          PROFILE_TEAM=$(security cms -D -i "$PROFILE_FILE" | plutil -extract TeamIdentifier.0 raw - 2>/dev/null || echo "")

          echo "Provisioning Profile UUID: $PROFILE_UUID"
          echo "Provisioning Profile Name: $PROFILE_NAME"
          echo "Provisioning Profile Team: $PROFILE_TEAM"

          cp "$PROFILE_FILE" ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision

          # Resolve Team ID
          FINAL_TEAM_ID="$TEAM_ID_INPUT"
          if [ -z "$FINAL_TEAM_ID" ]; then
            FINAL_TEAM_ID="$PROFILE_TEAM"
          fi
          if [ -z "$FINAL_TEAM_ID" ]; then
            FINAL_TEAM_ID="7S544F46G5"
          fi
          echo "Resolved Team ID: $FINAL_TEAM_ID"

          # Export variables for downstream steps
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV
          echo "CERT_IDENTITY=$CERT_IDENTITY" >> $GITHUB_ENV
          echo "PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          echo "TEAM_ID=$FINAL_TEAM_ID" >> $GITHUB_ENV

      - name: Generate ExportOptions.plist
        env:
          EXPORT_METHOD: ${{ github.event.inputs.export_method || 'app-store' }}
        run: |
          node -e "
          const fs = require('fs');
          const method = process.env.EXPORT_METHOD || 'app-store';
          const teamId = process.env.TEAM_ID || '7S544F46G5';
          const certIdentity = process.env.CERT_IDENTITY || 'Apple Distribution';
          const profileName = process.env.PROFILE_NAME || '';

          const xml = '<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n' +
            '<!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">\n' +
            '<plist version=\"1.0\">\n' +
            '<dict>\n' +
            '    <key>method</key>\n' +
            '    <string>' + method + '</string>\n' +
            '    <key>teamID</key>\n' +
            '    <string>' + teamId + '</string>\n' +
            '    <key>signingStyle</key>\n' +
            '    <string>manual</string>\n' +
            '    <key>signingCertificate</key>\n' +
            '    <string>' + certIdentity + '</string>\n' +
            '    <key>provisioningProfiles</key>\n' +
            '    <dict>\n' +
            '        <key>com.baltorotech.myjournal</key>\n' +
            '        <string>' + profileName + '</string>\n' +
            '    </dict>\n' +
            '    <key>destination</key>\n' +
            '    <string>export</string>\n' +
            '    <key>stripSwiftSymbols</key>\n' +
            '    <true/>\n' +
            '    <key>compileBitcode</key>\n' +
            '    <false/>\n' +
            '</dict>\n' +
            '</plist>\n';

          fs.writeFileSync('ios/ExportOptions.plist', xml);
          "
          echo "Generated ios/ExportOptions.plist:"
          cat ios/ExportOptions.plist
          plutil -lint ios/ExportOptions.plist

      - name: Build and Archive iOS Workspace
        run: |
          mkdir -p "$RUNNER_TEMP/build"
          xcodebuild archive \
            -workspace ios/MyJournal.xcworkspace \
            -scheme MyJournal \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/build/MyJournal.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="$CERT_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            -quiet

      - name: Export IPA
        run: |
          mkdir -p "$RUNNER_TEMP/export"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/build/MyJournal.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates

          mkdir -p build/output
          cp "$RUNNER_TEMP/export"/*.ipa build/output/
          echo "Successfully generated IPA artifact(s):"
          ls -la build/output/

      - name: Upload to TestFlight
        if: ${{ (github.event.inputs.upload_to_testflight == 'true' || github.event.inputs.upload_to_testflight == true || github.ref_type == 'tag') && success() }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          if [ -z "$APP_STORE_CONNECT_KEY_ID" ] || [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] || [ -z "$APP_STORE_CONNECT_KEY_BASE64" ]; then
            echo "::error::App Store Connect API secrets (APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_BASE64) are not configured!"
            exit 1
          fi

          IPA_PATH=$(ls build/output/*.ipa | head -n 1)
          if [ -z "$IPA_PATH" ] || [ ! -f "$IPA_PATH" ]; then
            echo "::error::No compiled IPA file found in build/output/ for TestFlight upload!"
            exit 1
          fi

          echo "Target IPA: $IPA_PATH"
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_FILE="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          echo "$APP_STORE_CONNECT_KEY_BASE64" | base64 --decode > "$KEY_FILE"

          echo "Delivering IPA to App Store Connect / TestFlight..."
          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --show-progress

          echo "Successfully delivered build to TestFlight!"

      - name: Clean up temporary Keychain and Provisioning Profile
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            echo "Deleting temporary keychain: $KEYCHAIN_PATH"
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision || true
          rm -rf "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/build" "$RUNNER_TEMP/export" ios/ExportOptions.plist ~/.appstoreconnect/private_keys || true

      - name: Upload Release IPA Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ipa
          path: build/output/*.ipa
          retention-days: 14
